packages:
  - 'apps/*'
  - 'configs/*'
  - 'packages/*'
  - 'infra/*'
  - 'scripts/*'
  - 'docs/*'

allowBuilds:
  esbuild: true
  # msw's postinstall only prints a funding notice; the worker script is committed
  # to apps/web/public and refreshed with `pnpm --filter @repo/web mock:init`.
  msw: false
  sharp: true

onlyBuiltDependencies:
  - sharp

